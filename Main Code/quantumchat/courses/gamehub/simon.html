<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Simon — Classic Memory ✦</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        :root{
            --bg-dark: linear-gradient(120deg,#141e30,#243b55);
            --card-bg: rgba(255,255,255,0.06);
            --accent-gradient: linear-gradient(270deg,#34c759,#007aff,#ff2d55);
            --muted: rgba(255,255,255,0.75);
            --radius: 18px;
            --pad-radius: 14px;
            --glass: rgba(255,255,255,0.04);
        }
        *{box-sizing:border-box}
        html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
        body{display:flex;align-items:flex-start;justify-content:center;padding:28px;background:var(--bg-dark);color:white;min-height:100vh;}
        @keyframes gradientShift{
            0%{background-position:0% 50%}
            50%{background-position:100% 50%}
            100%{background-position:0% 50%}
        }

        /* Container */
        .container{width:100%;max-width:1100px;display:flex;gap:18px;}

        /* Left controls */
        .left-panel{
            width:260px;
            background: var(--card-bg);
            border-radius:16px;
            padding:18px;
            backdrop-filter:blur(8px);
            box-shadow:0 12px 40px rgba(0,0,0,0.45);
            border:1px solid rgba(255,255,255,0.03);
        }
        .left-panel h2{
            margin:0 0 12px;
            font-size:18px;
            font-weight:700;
            background: var(--accent-gradient);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            background-size:600% 600%;
            animation: gradientShift 11s linear infinite;
        }
        .control-btn{
            display:block;
            width:100%;
            padding:10px 14px;
            border-radius:14px;
            border:none;
            color:white;
            background:var(--accent-gradient);
            background-size:500% 500%;
            animation: gradientShift 10s ease infinite;
            font-weight:600;
            cursor:pointer;
            margin-bottom:10px;
            box-shadow:0 6px 18px rgba(0,0,0,0.25);
        }
        .small-btn{
            display:inline-block;
            padding:8px 12px;
            border-radius:12px;
            border:1px solid rgba(255,255,255,0.06);
            background:rgba(255,255,255,0.02);
            color:inherit;
            cursor:pointer;
        }

        /* Difficulty segmented control */
        .difficulty {
            display:flex;
            gap:8px;
            margin-top:10px;
        }
        .diff-btn {
            flex:1;
            padding:8px 10px;
            border-radius:12px;
            border:1px solid rgba(255,255,255,0.06);
            background:rgba(255,255,255,0.02);
            color:inherit;
            cursor:pointer;
            text-align:center;
            font-weight:600;
            transition: all .18s;
        }
        .diff-btn.active {
            background: linear-gradient(135deg,#43e97b,#38f9d7);
            color:#032;
            box-shadow:0 6px 18px rgba(0,0,0,0.18);
        }
        .diff-btn.active.normal {
            background: linear-gradient(135deg,#667eea,#764ba2);
            color:#fff;
        }

        /* game card */
        .game-card{
            flex:1;
            padding:18px;
            border-radius:20px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            box-shadow: 0 18px 60px rgba(0,0,0,0.5);
            display:flex;
            flex-direction:column;
            gap:12px;
            border:1px solid rgba(255,255,255,0.03);
            align-items:center;
        }

        /* Header */
        .header-row{width:100%;display:flex;align-items:center;justify-content:space-between;}
        .header-row h1{
            margin:0;
            font-size:1.6rem;
            background: linear-gradient(270deg, #ff4e50, #f9d423, #1fa2ff, #12d8fa, #a6ffcb);
            background-size:800% 800%;
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            animation: gradientShift 12s ease infinite;
        }

        /* Board area - Simon circle */
        .board-area{display:flex;gap:22px;align-items:center;justify-content:center;width:100%;}
        .simon-wrap{width:520px;max-width:86vw;aspect-ratio:1/1;position:relative;display:grid;place-items:center;}
        .simon-ring{
            width:100%;
            height:100%;
            border-radius:50%;
            display:grid;
            grid-template-columns:1fr 1fr;
            grid-template-rows:1fr 1fr;
            overflow:visible;
            position:relative;
            box-shadow:0 12px 40px rgba(0,0,0,0.5);
        }

        /* Four pads */
        .pad{
            width:100%;
            height:100%;
            padding:16%;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:var(--pad-radius);
            transform-origin:center;
            transition:filter 0.12s, transform 0.12s, box-shadow 0.12s;
            box-shadow: inset 0 -6px 18px rgba(0,0,0,0.12);
            cursor:pointer;
            user-select:none;
            position:relative;
        }
        .pad:active{transform:scale(0.98)}
        .pad-label{position:absolute;font-weight:700;font-size:14px;color:rgba(0,0,0,0.6);bottom:8%;}

        /* Colors */
        .pad.green{background:linear-gradient(135deg,#2ecc71,#27ae60);border-top-left-radius:50%;}
        .pad.red{background:linear-gradient(135deg,#ff6b6b,#ff3b30);border-top-right-radius:50%;}
        .pad.yellow{background:linear-gradient(135deg,#ffd166,#f7b500);border-bottom-left-radius:50%;}
        .pad.blue{background:linear-gradient(135deg,#6ec1ff,#3b82f6);border-bottom-right-radius:50%;}

        /* when lit */
        .pad.lit{filter:brightness(1.45) saturate(1.2); box-shadow:0 12px 30px rgba(0,0,0,0.5); transform:scale(1.01);}

        /* center controls */
        .center-hub{
            position:absolute;
            width:42%;
            height:42%;
            background:rgba(0,0,0,0.6);
            border-radius:50%;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            color:white;
            border:6px solid rgba(255,255,255,0.06);
            text-align:center;
            padding:8px;
        }
        .level{
            font-size:22px;font-weight:700;margin-top:6px;
        }
        .hint{font-size:13px;color:rgba(255,255,255,0.75);}

        /* Right panel */
        .right-panel{width:260px;display:flex;flex-direction:column;gap:12px;}
        .right-card{background:var(--glass);border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.03);min-height:80px}

        /* responsive */
        @media (max-width:900px){
            .container{flex-direction:column;align-items:center;}
            .left-panel,.right-panel{width:92%;}
            .game-card{width:92%;}
            .simon-wrap{max-width:92vw}
        }
    </style>
</head>
<body>
<div class="container">
    <aside class="left-panel">
        <h2>Controls</h2>
        <button id="btnStart" class="control-btn">Start</button>
        <button id="btnStrict" class="control-btn" style="background:linear-gradient(135deg,#ff9a9e,#f6d365)">Strict: Off</button>

        <div style="margin-top:12px;">
            <div class="hint">Speed</div>
            <input id="speedRange" type="range" min="400" max="1200" step="100" value="800" style="width:100%;margin-top:8px;">
        </div>

        <div style="margin-top:12px;">
            <div class="hint">Difficulty</div>
            <div class="difficulty">
                <button id="btnNormal" class="diff-btn active normal">Normal</button>
                <button id="btnEasy" class="diff-btn">Easy</button>
            </div>
            <div class="hint" style="margin-top:8px">Easy reveals the sequence log to help you learn.</div>
        </div>

        <div style="margin-top:12px;">
            <div class="hint">How to play</div>
            <div class="hint" style="margin-top:6px">Memorize the sequence of lit pads and repeat it. In Strict mode a mistake restarts the game.</div>
        </div>
    </aside>

    <main class="game-card" role="main" aria-label="Simon game">
        <div class="header-row" style="width:100%">
            <h1>✦ Simon — Classic Memory ✦</h1>
            <div style="display:flex;gap:8px;align-items:center">
                <div class="hint">Round:</div>
                <div id="roundPill" class="status-pill" style="background:linear-gradient(135deg,#ff7e5f,#feb47b);padding:8px 12px;border-radius:12px;font-weight:700;">0</div>
            </div>
        </div>

        <div class="board-area">
            <div class="simon-wrap" aria-live="polite">
                <div class="simon-ring" id="simonRing" role="application" aria-label="Simon pads">
                    <div class="pad green" data-color="green" id="padGreen" aria-label="Green pad" title="Green"></div>
                    <div class="pad red" data-color="red" id="padRed" aria-label="Red pad" title="Red"></div>
                    <div class="pad yellow" data-color="yellow" id="padYellow" aria-label="Yellow pad" title="Yellow"></div>
                    <div class="pad blue" data-color="blue" id="padBlue" aria-label="Blue pad" title="Blue"></div>

                    <div class="center-hub" style="pointer-events:none;">
                        <div class="hint">Simon</div>
                        <div class="level" id="levelText">—</div>
                        <div class="hint" id="statusText" style="margin-top:6px">Press Start</div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <aside class="right-panel">
        <div class="right-card" id="seqCard" style="display:none;">
            <div class="hint">Sequence Log</div>
            <div id="seqLog" style="margin-top:8px;font-family:monospace;word-break:break-word;min-height:48px;"></div>
        </div>
        <div class="right-card">
            <div class="hint">High Score</div>
            <div id="highScore" style="font-size:20px;font-weight:700;margin-top:8px">0</div>
        </div>
    </aside>
</div>

<script>
    /* Classic Simon — minimal twist, clean UI */
    /* Behavior:
       - Sequence Log hidden by default
       - Difficulty control: Normal (default) hides log; Easy shows log
    */

    document.addEventListener('DOMContentLoaded', () => {
        // Elements
        const padEls = {
            green: document.getElementById('padGreen'),
            red: document.getElementById('padRed'),
            yellow: document.getElementById('padYellow'),
            blue: document.getElementById('padBlue')
        };
        const btnStart = document.getElementById('btnStart');
        const btnStrict = document.getElementById('btnStrict');
        const speedRange = document.getElementById('speedRange');
        const levelText = document.getElementById('levelText');
        const statusText = document.getElementById('statusText');
        const roundPill = document.getElementById('roundPill');
        const seqLog = document.getElementById('seqLog');
        const seqCard = document.getElementById('seqCard');
        const highScoreEl = document.getElementById('highScore');
        const btnNormal = document.getElementById('btnNormal');
        const btnEasy = document.getElementById('btnEasy');

        // Game state
        let sequence = [];
        let playerIndex = 0;
        let playingSequence = false;
        let strict = false;
        let gameActive = false;
        let playbackSpeed = Number(speedRange.value); // ms delay between steps
        let highScore = Number(localStorage.getItem('simonHigh') || 0);
        let difficulty = 'normal'; // 'normal' | 'easy'

        highScoreEl.textContent = highScore;

        // Sound setup (WebAudio simple tones)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        function ensureAudio(){
            if(!audioCtx) audioCtx = new AudioContext();
        }
        const freqs = { green: 329.6, red: 261.6, yellow: 392.0, blue: 220.0 };

        function playTone(color, duration=300){
            try{
                ensureAudio();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'sine';
                o.frequency.value = freqs[color];
                g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.02);
                o.connect(g); g.connect(audioCtx.destination);
                o.start();
                setTimeout(()=>{
                    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.02);
                    setTimeout(()=> o.stop(), 30);
                }, duration);
            }catch(e){
                // Audio may be blocked; ignore silently
            }
        }

        // Utilities
        const padOrder = ['green','red','yellow','blue'];
        function randomPad(){ return padOrder[Math.floor(Math.random()*padOrder.length)]; }
        function setStatus(msg){ statusText.textContent = msg; }
        function setLevel(n){ levelText.textContent = n; roundPill.textContent = n; }
        function updateSeqLog(){ seqLog.textContent = sequence.join(' › '); }

        // Highlight/unhighlight pad
        function lightPad(color, duration=400){
            const el = padEls[color];
            if(!el) return Promise.resolve();
            return new Promise(resolve=>{
                el.classList.add('lit');
                playTone(color, duration);
                setTimeout(()=>{ el.classList.remove('lit'); setTimeout(resolve, 50); }, duration);
            });
        }

        // Playback sequence to player
        async function playSequence(){
            if(sequence.length===0) return;
            playingSequence = true;
            setStatus('Watch the sequence');
            await sleep(250);
            for(let i=0;i<sequence.length;i++){
                const color = sequence[i];
                await lightPad(color, Math.max(120, playbackSpeed - 200));
                await sleep( Math.max(80, playbackSpeed/3) );
            }
            playingSequence = false;
            setStatus('Your turn');
            playerIndex = 0;
        }

        // Sleep helper
        function sleep(ms){ return new Promise(res=>setTimeout(res, ms)); }

        // Start new game
        function startGame(){
            sequence = [];
            playerIndex = 0;
            gameActive = true;
            setLevel(0);
            setStatus('Starting...');
            nextRound();
        }

        // Advance to next round: append random pad and play sequence
        async function nextRound(){
            sequence.push(randomPad());
            if(difficulty === 'easy') updateSeqLog();
            setLevel(sequence.length);
            // update high score if needed
            if(sequence.length > highScore){
                highScore = sequence.length;
                localStorage.setItem('simonHigh', highScore);
                highScoreEl.textContent = highScore;
            }
            await sleep(300);
            await playSequence();
        }

        // Handle player input
        async function handleInput(color){
            if(!gameActive || playingSequence) return;
            // Play sound & highlight immediately for feedback
            await lightPad(color, Math.max(110, playbackSpeed/2));
            // Check against sequence
            const expected = sequence[playerIndex];
            if(color === expected){
                playerIndex++;
                if(playerIndex >= sequence.length){
                    // success this round
                    setStatus('Good! Next round...');
                    await sleep(600);
                    await nextRound();
                } else {
                    setStatus(`Good — ${playerIndex}/${sequence.length}`);
                }
            } else {
                // mistake
                playError();
                if(strict){
                    setStatus('Wrong — restarting (Strict mode)');
                    await sleep(900);
                    startGame();
                } else {
                    setStatus('Wrong — try again');
                    // replay the sequence for retry
                    await sleep(800);
                    await playSequence();
                }
            }
        }

        function playError(){
            // short buzzer
            try{
                ensureAudio();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'sawtooth';
                o.frequency.value = 120;
                g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.2, audioCtx.currentTime + 0.01);
                o.connect(g); g.connect(audioCtx.destination);
                o.start();
                setTimeout(()=>{ g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.02); setTimeout(()=>o.stop(), 40); }, 350);
            }catch(e){}
        }

        // Wire pad clicks/touches
        Object.keys(padEls).forEach(color=>{
            const el = padEls[color];
            el.addEventListener('click', ()=>{ // resume audio on user gesture if needed
                if(!audioCtx) try{ ensureAudio(); }catch(e){}
                handleInput(color);
            });
        });

        // Keyboard shortcuts: g r y b
        document.addEventListener('keydown', (e)=>{
            if(!gameActive) return;
            const key = e.key.toLowerCase();
            if(key === 'g') handleInput('green');
            if(key === 'r') handleInput('red');
            if(key === 'y') handleInput('yellow');
            if(key === 'b') handleInput('blue');
        });

        // Button handlers
        btnStart.addEventListener('click', ()=> {
            try{ ensureAudio(); }catch(e){}
            startGame();
        });

        btnStrict.addEventListener('click', ()=>{
            strict = !strict;
            btnStrict.textContent = `Strict: ${strict ? 'On' : 'Off'}`;
            if(strict) btnStrict.style.boxShadow = '0 6px 18px rgba(255,120,120,0.12)';
            else btnStrict.style.boxShadow = '';
        });

        speedRange.addEventListener('input', (e)=>{
            playbackSpeed = Number(e.target.value);
        });

        // Difficulty buttons
        function setDifficulty(d){
            difficulty = d;
            if(d === 'easy'){
                btnEasy.classList.add('active');
                btnNormal.classList.remove('active');
                seqCard.style.display = ''; // show sequence log
                // ensure seqLog updated
                updateSeqLog();
            } else {
                btnNormal.classList.add('active','normal');
                btnEasy.classList.remove('active');
                seqCard.style.display = 'none'; // hide sequence log
            }
        }
        btnNormal.addEventListener('click', ()=> setDifficulty('normal'));
        btnEasy.addEventListener('click', ()=> setDifficulty('easy'));

        // Initialize difficulty (normal hides log)
        setDifficulty('normal');

        // Expose a small debug reset for sequence (double-click center)
        const center = document.querySelector('.center-hub');
        center.addEventListener('dblclick', ()=>{
            sequence=[]; updateSeqLog(); setStatus('Sequence cleared (debug)');
        });

        // Initialize UI
        setLevel(0);
        setStatus('Press Start');

    }); // DOMContentLoaded
</script>
</body>
</html>
