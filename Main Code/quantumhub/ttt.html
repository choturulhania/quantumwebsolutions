<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        body {
            margin: 0;
            /* Changed to 'sans-serif' for better font fallback */
            font-family: sans-serif;
            background: linear-gradient(120deg, #141e30, #243b55);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Use min-height to ensure content fits, but flex property keeps it centered */
            min-height: 100vh;
            color: #fff;
        }

        h1 {
            text-shadow: 0 0 20px #0ff;
            margin-bottom: 20px;
        }

        #score {
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #0ff;
        }

        #gameBoard {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(3, 120px);
            gap: 15px;
        }

        .cell {
            background-color: #222;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            cursor: pointer;
            color: #0ff;
            transition: transform 0.2s;
            box-shadow: 0 0 10px #0ff;
        }

        .cell:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px #0ff;
        }

        .x {
            color: #ff0;
            text-shadow: 0 0 20px #ff0;
        }

        .o {
            color: #f0f;
            text-shadow: 0 0 20px #f0f;
        }

        #resetBtn {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background-color: #0ff;
            color: #111;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 0 20px #0ff;
            transition: transform 0.2s;
        }

        #resetBtn:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

<h1>Tic Tac Toe</h1>
<div id="score">Player X: 0 | Player O: 0</div>
<div id="gameBoard"></div>
<button id="resetBtn">Restart Game</button>

<script>
    // FIX: Wrap all logic in DOMContentLoaded to ensure HTML elements are loaded before the script runs.
    document.addEventListener('DOMContentLoaded', () => {

        const board = Array(9).fill(null);
        let currentPlayer = 'X';
        let playerXScore = 0;
        let playerOScore = 0;

        // Get elements after DOM is ready
        const gameBoard = document.getElementById('gameBoard');
        const scoreDisplay = document.getElementById('score');
        const resetBtn = document.getElementById('resetBtn');

        // Create board cells
        for (let i = 0; i < 9; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.dataset.index = i;
            gameBoard.appendChild(cell);
        }

        // Handle cell click
        gameBoard.addEventListener('click', (e) => {
            // Use e.target.dataset.index to get the index, but ensure it's a cell being clicked
            const index = e.target.dataset.index;
            if (index === undefined || board[index] || checkWinner()) return; // Added check for undefined index

            board[index] = currentPlayer;
            e.target.textContent = currentPlayer;
            e.target.classList.add(currentPlayer.toLowerCase());

            if (checkWinner()) {
                // Use a slight delay for better UX before the alert and score update
                setTimeout(() => {
                    alert(`Player ${currentPlayer} wins!`);
                    if (currentPlayer === 'X') playerXScore++;
                    else playerOScore++;
                    updateScore();
                }, 10);
            } else if (board.every(cell => cell)) {
                setTimeout(() => {
                    alert("It's a draw!");
                }, 10);
            } else {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            }
        });

        // Check for winner
        function checkWinner() {
            const winCombos = [
                [0,1,2], [3,4,5], [6,7,8], // Rows
                [0,3,6], [1,4,7], [2,5,8], // Columns
                [0,4,8], [2,4,6]          // Diagonals
            ];
            return winCombos.some(combo =>
                board[combo[0]] &&
                board[combo[0]] === board[combo[1]] &&
                board[combo[0]] === board[combo[2]]
            );
        }

        // Update score display
        function updateScore() {
            scoreDisplay.textContent = `Player X: ${playerXScore} | Player O: ${playerOScore}`;
        }

        // Reset game (only board, not score)
        resetBtn.addEventListener('click', () => {
            board.fill(null);
            currentPlayer = 'X';
            document.querySelectorAll('.cell').forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('x','o');
            });
        });
    }); // End of DOMContentLoaded
</script>

</body>
</html>
