<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>French Practice ✧</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(120deg, #141e30, #243b55);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        header h1 {
            font-size: 3em;
            background: linear-gradient(270deg, #ff4e50, #f9d423, #1fa2ff, #12d8fa, #a6ffcb);
            background-size: 800% 800%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 12s ease infinite;
            text-align: center;
            margin-bottom: 30px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50% }
            50% { background-position: 100% 50% }
            100% { background-position: 0% 50% }
        }

        .card {
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            padding: 30px;
            max-width: 700px;
            width: 100%;
            animation: fadeIn 0.6s ease;
            text-align: center;
        }

        .card h2 {
            font-size: 1.8em;
            margin-bottom: 15px;
            background: linear-gradient(270deg, #ff7e5f, #feb47b);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 8s ease infinite;
        }

        .question {
            margin: 15px 0;
            font-size: 1.1em;
            text-align: left;
            color: #f0f0f0;
        }

        input {
            padding: 10px;
            width: 100%;
            border-radius: 10px;
            border: 1px solid #ccc;
            margin-top: 5px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin: 10px;
            font-size: 1em;
            font-weight: 500;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            color: white;
        }

        .btn-blue {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
        }
        .btn-blue:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn-green {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .btn-green:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<header>
    <h1>French Practice</h1>
</header>
<main>
    <div class="card">
        <h2>Quick Practice</h2>
        <div class="question">Translate to French: <b>Hello</b></div>
        <input type="text" placeholder="Your answer...">
        <div class="question">Translate to French: <b>Goodbye</b></div>
        <input type="text" placeholder="Your answer...">
        <div>
            <a href="french.html" class="btn btn-blue">⬅ Back to Course</a>
            <a href="frenchpractice2.html" class="btn btn-green">Next Practice ➡</a>
            <button class="btn btn-green" onclick="alert('Answers: Bonjour, Au revoir')">Check Answers</button>
        </div>
    </div>
</main>
</body>
</html>
