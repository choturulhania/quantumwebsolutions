<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        /* Global Box Sizing and Overflow Fix */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(120deg, #141e30, #243b55);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px;
            max-width: 100vw;
            overflow-x: hidden;
        }

        header h1 {
            font-size: 3em;
            background: linear-gradient(270deg, #ff4e50, #f9d423, #1fa2ff, #12d8fa, #a6ffcb);
            background-size: 800% 800%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 12s ease infinite;
            text-align: center;
            margin: 30px 0 40px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50% }
            50% { background-position: 100% 50% }
            100% { background-position: 0% 50% }
        }

        .chat-container {
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            max-width: 700px;
            width: 100%;
            height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            font-size: 1.1em;
            line-height: 1.4;
            animation: messageIn 0.3s ease-out;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(45deg, #1fa2ff, #12d8fa);
        }

        .message.bot {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.15);
        }

        .message-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .loading-indicator {
            text-align: center;
            font-style: italic;
            color: rgba(255, 255, 255, 0.6);
            padding: 10px;
            display: none;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* --- Input Area --- */
        .input-area {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        #user-input {
            flex: 1;
            padding: 12px 18px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1em;
            outline: none;
            transition: background 0.3s;
        }

        #user-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        #user-input:focus {
            background: rgba(255, 255, 255, 0.2);
        }

        .send-button {
            padding: 12px 25px;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: #141e30;
            transition: transform 0.3s, box-shadow 0.3s;
            flex-shrink: 0;
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        @keyframes messageIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Mobile/Phone View Optimization (Max 600px) --- */
        @media (max-width: 600px) {
            body {
                padding: 0;
                justify-content: flex-end;
            }

            header h1 {
                font-size: 2em;
                margin: 15px 0 10px;
            }

            .chat-container {
                /* Removed border-radius: 0; here to allow the default 20px radius to apply */
                height: 90vh;
                max-width: 100%;
                width: 90%; /* Ensure it's explicitly 100% on mobile */
            }

            .chat-window {
                padding: 15px;
            }

            .message {
                font-size: 1em;
                padding: 10px 15px;
                max-width: 90%;
            }

            .input-area {
                padding: 10px 15px;
                gap: 8px;
            }

            #user-input {
                padding: 10px 15px;
            }

            .send-button {
                padding: 10px 15px;
                height: 40px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
<header>
    <h1>Quantum AI</h1>
</header>

<div class="chat-container">
    <div id="chat-window" class="chat-window">
    </div>
    <div id="loading-indicator" class="loading-indicator">Bot is thinking...</div>
    <div class="input-area">
        <input
                id="user-input"
                type="text"
                placeholder="Ask me anything..."
                onkeypress="if(event.key === 'Enter') sendMessage()"
        />
        <button
                id="send-button"
                onclick="sendMessage()"
                class="send-button"
        >
            Send
        </button>
    </div>
</div>

<script>
    // API Endpoint for Text Chat (Gemini)
    const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent";

    // IMPORTANT: Replace the placeholder with your actual API key
    const apiKey = "AIzaSyCUFcIQQUzgJ6hJlpOspZzTHncbGy2XKvc";

    const chatWindow = document.getElementById("chat-window");
    const userInput = document.getElementById("user-input");
    const loadingIndicator = document.getElementById("loading-indicator");

    let chatHistory = [];

    // --- Chat Rendering ---

    /**
     * Helper function to create a message element
     * @param {string} content - The text content.
     * @param {string} sender - 'user' or 'bot'.
     */
    const createMessageElement = (content, sender) => {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender}`;

        const contentDiv = document.createElement('div');
        contentDiv.className = 'message-content';

        const textNode = document.createElement('p');
        textNode.innerText = content;
        textNode.style.margin = '0';
        contentDiv.appendChild(textNode);

        messageDiv.appendChild(contentDiv);
        return messageDiv;
    };

    // --- Main Chat Logic ---

    // Main function to send a message and get a response
    async function sendMessage() {
        const userMessage = userInput.value.trim();
        if (userMessage === "") return;

        if (apiKey === "") {
            const message = "Please provide your actual **API key** in the JavaScript code to use the service.";
            chatWindow.appendChild(createMessageElement(message, 'bot'));
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return;
        }

        // 1. Display user message and clear input
        chatWindow.appendChild(createMessageElement(userMessage, 'user'));
        userInput.value = "";
        chatWindow.scrollTop = chatWindow.scrollHeight;

        // Show loading indicator
        loadingIndicator.style.display = 'block';

        // Add user message to history
        chatHistory.push({
            "role": "user",
            "parts": [{"text": userMessage}]
        });

        const payload = {
            "contents": chatHistory
        };

        const headers = {
            'Content-Type': 'application/json'
        };

        let responseText = "Sorry, something went wrong. Please try again.";

        try {
            // Fetch call with exponential backoff
            const maxRetries = 5;
            for (let i = 0; i < maxRetries; i++) {
                const response = await fetch(`${API_URL}?key=${apiKey}`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.candidates && data.candidates.length > 0 && data.candidates[0].content && data.candidates[0].content.parts) {
                        responseText = data.candidates[0].content.parts[0].text;
                    }
                    break;
                } else if (response.status === 429) {
                    const waitTime = Math.pow(2, i) * 1000;
                    console.log(`Rate limit exceeded. Retrying in ${waitTime / 1000} seconds.`);
                    await new Promise(res => setTimeout(res, waitTime));
                } else {
                    throw new Error(`API returned status code ${response.status}`);
                }
            }
        } catch (error) {
            console.error("Text API call failed:", error);
            responseText = "Text API call failed. Check the console for details.";
        } finally {
            loadingIndicator.style.display = 'none';
            // Display bot message and add to history
            chatWindow.appendChild(createMessageElement(responseText, 'bot'));
            chatHistory.push({
                "role": "model",
                "parts": [{"text": responseText}]
            });
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
    }
</script>
</body>
</html>
