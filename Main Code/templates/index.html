<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="favicon1.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weblets</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(120deg, #141e30, #243b55);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header h1 {
            font-size: 3em;
            background: linear-gradient(270deg, #ff4e50, #f9d423, #1fa2ff, #12d8fa, #a6ffcb);
            background-size: 800% 800%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 12s ease infinite;
            text-align: center;
            margin: 30px 0 40px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50% }
            50% { background-position: 100% 50% }
            100% { background-position: 0% 50% }
        }

        main {
            width: 100%;
            max-width: 900px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .tab {
            padding: 12px 24px;
            margin: 0 8px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .tab.active {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: #000;
        }

        .tab:hover {
            background: rgba(255,255,255,0.2);
        }

        .templates {
            display: none;
            flex-direction: column;
            gap: 25px;
            animation: fadeIn 0.5s ease;
        }

        .templates.active {
            display: flex;
        }

        .card {
            display: flex;
            align-items: center;
            gap: 20px;
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            padding: 20px;
            text-align: left;
            animation: fadeIn 0.6s ease;
        }

        .card img {
            width: 160px;
            height: 100px;
            border-radius: 12px;
            object-fit: cover;
        }

        .card-content {
            flex: 1;
        }

        .card h3 {
            font-size: 1.6em;
            margin-bottom: 10px;
            background: linear-gradient(270deg, #ff7e5f, #feb47b);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 8s ease infinite;
        }

        .card p {
            font-size: 1em;
            color: #eaeaea;
            margin-bottom: 15px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin-right: 10px;
            font-size: 0.95em;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            color: white;
            transition: all 0.3s;
        }

        .btn-blue {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
        }
        .btn-blue:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn-green {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .btn-green:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .preview-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .preview-modal.active {
            display: flex;
        }

        .preview-box {
            width: 90%;
            height: 80%;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 20px;
            cursor: pointer;
            color: #000;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 0.9rem;
            color: #ddd;
            margin-top: 60px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<header>
    <h1>Weblets</h1>
</header>

<main>
    <!-- Tabs -->
    <section class="tabs">
        <div class="tab active" data-tab="html">HTML</div>
        <div class="tab" data-tab="css">CSS</div>
        <div class="tab" data-tab="js">JS</div>
    </section>

    <!-- HTML Templates -->
    <section id="html" class="templates active">
        <!-- Example Card (remove this and add your own) -->
        <!--
        <div class="card">
            <img src="templates/html/preview1.png" alt="Template Preview">
            <div class="card-content">
                <h3>My HTML Template</h3>
                <p>Describe what your HTML template does or what it looks like.</p>
                <a href="#" class="btn btn-blue" onclick="previewTemplate('templates/html/template1.html')">Preview</a>
                <a href="templates/html/template1.html" download class="btn btn-green">Download</a>
            </div>
        </div>
        -->
        <div class="card">
            <img src="html/toggle_sidebar_classic.png" alt="Template Preview">
            <div class="card-content">
                <h3>Classic Sidebar</h3>
                <p>Minimalist site with a toggle sidebar.</p>
                <a href="#" class="btn btn-blue" onclick="previewTemplate('html/toggle_sidebar_classic.html')">Preview</a>
                <a href="html/toggle_sidebar_classic.html" download class="btn btn-green">Download</a>
            </div>
        </div>

        <div class="card">
            <img src="html/dock.png" alt="Template Preview">
            <div class="card-content">
                <h3>Liquid Glass Dock</h3>
                <p>Minimalist site with a macOS-based dock.</p>
                <a href="#" class="btn btn-blue" onclick="previewTemplate('html/dock.html')">Preview</a>
                <a href="html/dock.html" download class="btn btn-green">Download</a>
            </div>
        </div>

    </section>

    <!-- CSS Templates -->
    <section id="css" class="templates">
        <!-- Add your CSS template cards here -->
    </section>

    <!-- JS Templates -->
    <section id="js" class="templates">
        <!-- Add your JS template cards here -->
    </section>
</main>

<!-- Preview Modal -->
<div class="preview-modal" id="previewModal">
    <div class="preview-box">
        <span class="close-btn" onclick="closePreview()">✕</span>
        <iframe id="previewFrame" title="Template Preview"></iframe>
    </div>
</div>

<footer>
    &copy; 2025 Quantum Web Solutions. All Rights Reserved.
</footer>

<script>
    // Tab switching
    const tabs = document.querySelectorAll('.tab');
    const sections = document.querySelectorAll('.templates');

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            sections.forEach(s => s.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById(tab.dataset.tab).classList.add('active');
        });
    });

    // Preview modal
    const modal = document.getElementById('previewModal');
    const frame = document.getElementById('previewFrame');

    function previewTemplate(url) {
        modal.classList.add('active');
        frame.src = url;
    }

    function closePreview() {
        modal.classList.remove('active');
        frame.src = '';
    }
</script>
</body>
</html>
