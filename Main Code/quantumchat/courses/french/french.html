<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>French Course ✧</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(120deg, #141e30, #243b55);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        header h1 {
            font-size: 3em;
            background: linear-gradient(270deg, #ff4e50, #f9d423, #1fa2ff, #12d8fa, #a6ffcb);
            background-size: 800% 800%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 12s ease infinite;
            text-align: center;
            margin-bottom: 30px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50% }
            50% { background-position: 100% 50% }
            100% { background-position: 0% 50% }
        }

        .card {
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            padding: 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.6s ease;
            transition: transform 0.25s;
        }
        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            font-size: 1.8em;
            margin-bottom: 15px;
            background: linear-gradient(270deg, #ff7e5f, #feb47b);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 8s ease infinite;
        }

        .card p {
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #f0f0f0;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin: 10px;
            font-size: 1em;
            font-weight: 500;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            color: white;
        }

        .btn-blue {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
        }
        .btn-blue:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn-green {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .btn-green:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        @keyframes fadeIn {
            from { opacity:0; transform:translateY(20px); }
            to { opacity:1; transform:translateY(0); }
        }
    </style>
</head>
<body>
<header>
    <h1>✧ French Course ✧</h1>
</header>
<main>
    <div class="card">
        <h2>Bienvenue!</h2>
        <p>
            Start learning French vocabulary, grammar, and everyday conversation.
            Build your confidence to speak like a native.
        </p>
        <a href="frenchlesson1.html" class="btn btn-blue">Start Lesson 1</a>
        <a href="frenchpractice.html" class="btn btn-green">Practice</a>
    </div>
</main>
</body>
</html>
