<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monopoly GO!</title>
    <style>
        body {
            margin:0;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto
            ,sans-serif;
            background: linear-gradient(120deg, #141e30, #243b55);
            color:white;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:flex-start;
            min-height:100vh;
            padding:20px;
        }
        header h1 {
            font-size:3em;
            background: linear-gradient(270deg, #ff4e50, #f9d423, #1fa2ff, #12d8fa, #a6ffcb);
            background-size: 800% 800%;
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            animation: gradientShift 12s ease infinite;
            text-align:center;
            margin-bottom:30px;
        }
        @keyframes gradientShift {
            0% { background-position:0% 50%; }
            50% { background-position:100% 50%; }
            100% { background-position:0% 50%; }
        }
        .card {
            backdrop-filter: blur(12px);
            background: rgba(255,255,255,0.08);
            border-radius:20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            padding:30px;
            max-width:900px;
            width:100%;
            animation: fadeIn 0.6s ease;
            text-align:center;
        }
        .card h2 {
            font-size:1.8em;
            margin-bottom:15px;
            background: linear-gradient(270deg,#ff7e5f,#feb47b);
            background-size: 400% 400%;
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            animation: gradientShift 8s ease infinite;
        }
        #board-container {
            position:relative;
            width:600px;
            height:600px;
            margin:20px auto;
            border-radius:50%;
            background: radial-gradient(circle at center, #f0f0f0 5%, #ccc 95%);
        }
        .cell {
            position:absolute;
            width:70px;
            height:70px;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            font-size:0.7em;
            text-align:center;
            padding:2px;
            border-radius:10%;
            color:black;
            font-weight:600;
        }
        .player-marker {
            width:24px; height:24px;
            position:absolute;
            font-size:18px;
            text-align:center;
        }
        #controls { display:flex; justify-content:center; gap:15px; margin-top:20px; flex-wrap:wrap; }
        .btn {
            display:inline-block;
            padding:12px 24px;
            margin:10px;
            font-size:1em;
            font-weight:500;
            border-radius:25px;
            border:none;
            cursor:pointer;
            text-decoration:none;
            transition: all 0.3s;
            color:white;
            background: linear-gradient(135deg, #43e97b, #38f9d7);
        }
        .btn:hover { transform: translateY(-2px); box-shadow:0 5px 15px rgba(0,0,0,0.3);}
        #diceDisplay {
            font-size:2em;
            margin-top:15px;
            background: rgba(0,0,0,0.2);
            padding:10px 20px;
            border-radius:12px;
            display:inline-block;
        }
        #moneyBoard {
            display:flex;
            justify-content:center;
            gap:20px;
            margin-top:20px;
        }
        .moneyCard {
            background: rgba(255,255,255,0.08);
            padding:12px 20px;
            border-radius:12px;
            min-width:120px;
        }
        #log {
            text-align:left;
            max-height:150px;
            overflow-y:auto;
            margin-top:15px;
            background:rgba(255,255,255,0.05);
            padding:10px;
            border-radius:12px;
        }
        @keyframes fadeIn { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }
        dialog { border:none; border-radius:12px; padding:20px; background:rgba(0,0,0,0.9);}
        dialog button { padding:8px 16px; margin:5px; border:none; border-radius:12px; cursor:pointer; background:#007aff; color:white; font-weight:500;}
    </style>
</head>
<body>
<header><h1>Monopoly GO!</h1></header>
<main class="card">
    <h2>Game Board</h2>
    <div id="board-container"></div>
    <div id="controls">
        <button class="btn" id="rollDiceBtn" disabled>Roll Dice</button>
        <div id="diceDisplay">🎲 0</div>
    </div>
    <div id="moneyBoard"></div>
    <div id="log"></div>
</main>

<dialog id="playerDialog">
    <p>Choose number of players (2-4):</p>
    <input id="numPlayersInput" type="number" min="2" max="4" value="2" style="width:50px;">
    <button id="startGameBtn">Start Game</button>
</dialog>

<dialog id="buyDialog">
    <p id="buyText"></p>
    <button id="buyYes">Buy</button>
    <button id="buyNo">Skip</button>
</dialog>

<script>
    const boardContainer = document.getElementById('board-container');
    const log = document.getElementById('log');
    const diceDisplay = document.getElementById('diceDisplay');

    const numCells = 20;
    const radius = 250;
    const center = 300;

    let players = [];
    let currentPlayer = 0;

    const colors = ['#FF0000','#00FF00','#0000FF','#FFFF00'];
    const icons = ['🚗','🎩','🩰','👟'];

    const properties = Array.from({length:numCells}, (_,i)=>({
        id:i, owner:null, price:100 + i*20, name:'Property '+(i+1),
        color:['#ff9999','#99ff99','#9999ff','#ffff99','orange'][i%5]
    }));

    // create circular board
    for(let i=0;i<numCells;i++){
        const angle = (i/numCells)*2*Math.PI - Math.PI/2;
        const x = center + radius*Math.cos(angle) - 35;
        const y = center + radius*Math.sin(angle) - 35;
        const cell = document.createElement('div');
        cell.className='cell';
        cell.id='cell-'+i;
        cell.style.left = x+'px';
        cell.style.top = y+'px';
        cell.style.background=properties[i].color;
        cell.textContent=properties[i].name+'\n$'+properties[i].price;
        boardContainer.appendChild(cell);
    }

    // money tracker
    const moneyBoard = document.getElementById('moneyBoard');
    function renderMoney() {
        moneyBoard.innerHTML = '';
        players.forEach(p=>{
            const card = document.createElement('div');
            card.className='moneyCard';
            card.style.border='2px solid '+p.color;
            card.innerHTML=`<b>${p.name} ${p.icon}</b><br>Money: $${p.money}`;
            moneyBoard.appendChild(card);
        });
    }

    // log
    function addLog(msg){
        const div = document.createElement('div');
        div.textContent = msg;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
    }

    // render players
    function renderPlayers(){
        document.querySelectorAll('.player-marker').forEach(m=>m.remove());
        players.forEach(p=>{
            const cell = document.getElementById('cell-'+p.pos);
            const marker = document.createElement('div');
            marker.className='player-marker';
            marker.style.color=p.color;
            marker.textContent=p.icon;
            cell.appendChild(marker);
        });
        renderMoney();
    }

    // dice roll
    function rollDice() {
        const dice = Math.floor(Math.random()*6)+1;
        diceDisplay.textContent='🎲 '+dice;
        return dice;
    }

    // handle turn
    document.getElementById('rollDiceBtn').addEventListener('click',()=>{
        const p = players[currentPlayer];
        const dice = rollDice();
        addLog(`${p.name} rolled a ${dice}`);
        p.pos = (p.pos+dice)%numCells;
        renderPlayers();

        const prop = properties[p.pos];
        if(!prop.owner){
            if(p.money >= prop.price){
                document.getElementById('buyText').textContent=`${p.name}, do you want to buy ${prop.name} for $${prop.price}?`;
                const dialog = document.getElementById('buyDialog');
                dialog.showModal();

                document.getElementById('buyYes').onclick = ()=>{
                    p.money -= prop.price;
                    prop.owner = p.name;
                    p.properties.push(prop.id);
                    addLog(`${p.name} bought ${prop.name}`);
                    dialog.close();
                    nextTurn();
                };
                document.getElementById('buyNo').onclick = ()=>{
                    addLog(`${p.name} skipped buying ${prop.name}`);
                    dialog.close();
                    nextTurn();
                };
            } else {
                addLog(`${p.name} can't afford ${prop.name}`);
                nextTurn();
            }
        } else if(prop.owner !== p.name){
            const rent = Math.floor(prop.price/3);
            p.money -= rent;
            const owner = players.find(pl=>pl.name===prop.owner);
            if(owner) owner.money += rent;
            addLog(`${p.name} paid $${rent} rent to ${prop.owner}`);
            nextTurn();
        } else {
            addLog(`${p.name} landed on their own property`);
            nextTurn();
        }
    });

    function nextTurn(){
        currentPlayer = (currentPlayer+1)%players.length;
        addLog(`It's now ${players[currentPlayer].name}'s turn`);
    }

    // initial render
    function startGame(num){
        players = [];
        for(let i=0;i<num;i++){
            players.push({name:`Player ${i+1}`, color:colors[i], icon:icons[i], pos:0, money:1000, properties:[]});
        }
        currentPlayer = 0;
        renderPlayers();
        addLog(`${players[currentPlayer].name} starts the game`);
        document.getElementById('rollDiceBtn').disabled=false;
    }

    document.getElementById('startGameBtn').addEventListener('click',()=>{
        const num = parseInt(document.getElementById('numPlayersInput').value);
        if(num<2||num>4){ alert('Choose between 2 and 4 players'); return; }
        document.getElementById('playerDialog').close();
        startGame(num);
    });

    // show player selection modal at start
    document.getElementById('playerDialog').showModal();
</script>
</body>
</html>
