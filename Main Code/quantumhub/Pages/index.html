<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus App ✧</title>
    <style>
        /* ============================
           Base Styles
        ============================ */
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(120deg, #141e30, #243b55);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow: hidden;
            padding: 20px;
        }

        /* ============================
           Gradient Heading
        ============================ */
        header h1 {
            font-size: 3em;
            background: linear-gradient(270deg, #ff4e50, #f9d423, #1fa2ff, #12d8fa, #a6ffcb);
            background-size: 800% 800%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 12s ease infinite;
            text-align: center;
            margin-bottom: 30px;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50% }
            50% { background-position: 100% 50% }
            100% { background-position: 0% 50% }
        }

        /* ============================
           Card Styles
        ============================ */
        .card {
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            padding: 30px;
            max-width: 700px;
            width: 100%;
            animation: fadeIn 0.6s ease;
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 1.8em;
            margin-bottom: 15px;
            background: linear-gradient(270deg, #ff7e5f, #feb47b);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 8s ease infinite;
            text-align: center;
        }
        .card ul {
            text-align: left;
            line-height: 1.8;
            font-size: 1.1em;
            color: #f0f0f0;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin: 10px;
            font-size: 1em;
            font-weight: 500;
            border-radius: 25px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            color: white;
        }
        .btn-blue {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
        }
        .btn-blue:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================
           Canvas Animations
        ============================ */
        canvas#bgCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
        }

        /* ============================
           Input Styles
        ============================ */
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: none;
            border-bottom: 2px solid rgba(255,255,255,0.3);
            background: transparent;
            color: white;
            outline: none;
            font-size: 1em;
            transition: all 0.3s;
        }
        input:focus, select:focus {
            border-color: #43e97b;
            transform: scale(1.02);
        }
    </style>
</head>
<body>
<canvas id="bgCanvas"></canvas>

<header>
    <h1>Focus App</h1>
</header>

<main>
    <div class="card">
        <h2>Create Reminder</h2>
        <select id="type">
            <option value="">Select Type</option>
            <option value="Grayscale">Grayscale</option>
            <option value="Alert">Alert</option>
        </select>
        <input type="text" id="message" placeholder="Message (optional)">
        <input type="time" id="fromTime" placeholder="From (optional)">
        <input type="time" id="toTime" placeholder="To (optional)">
        <input type="number" id="everyMin" placeholder="Every X Minutes (optional)">
        <button class="btn btn-blue" id="createReminder">Create</button>
    </div>
    <div class="card" id="reminder-list">
        <h2>Reminders</h2>
        <!-- Reminders will appear here -->
    </div>
</main>

<script>
    // ======================
    // Canvas Interactive Animation
    // ======================
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];
    const colors = ['#ff4e50','#f9d423','#1fa2ff','#12d8fa','#a6ffcb'];
    for(let i=0;i<150;i++){
        particles.push({
            x: Math.random()*canvas.width,
            y: Math.random()*canvas.height,
            r: Math.random()*4+1,
            dx: (Math.random()-0.5)*2,
            dy: (Math.random()-0.5)*2,
            color: colors[Math.floor(Math.random()*colors.length)]
        });
    }

    function animate(){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        for(let p of particles){
            p.x += p.dx; p.y += p.dy;
            if(p.x>canvas.width||p.x<0)p.dx*=-1;
            if(p.y>canvas.height||p.y<0)p.dy*=-1;
            ctx.beginPath();
            ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
            ctx.fillStyle=p.color;
            ctx.fill();
        }
        requestAnimationFrame(animate);
    }
    animate();

    canvas.addEventListener('mousemove', e=>{
        for(let p of particles){
            let dx=p.x-e.clientX;
            let dy=p.y-e.clientY;
            let dist=Math.sqrt(dx*dx+dy*dy);
            if(dist<100){
                p.x-=dx*0.02;
                p.y-=dy*0.02;
            }
        }
    });

    // ======================
    // Reminders
    // ======================
    let reminders=[];
    function renderReminders(){
        const list=document.getElementById('reminder-list');
        list.innerHTML='<h2>Reminders</h2>';
        reminders.forEach((r,i)=>{
            const div=document.createElement('div');
            div.className='card';
            div.innerHTML=`<strong>${r.type}</strong> - ${r.message||''} <span class="small-text">${r.condition}</span>`;
            list.appendChild(div);
        });
    }

    // Notifications
    if('Notification' in window) Notification.requestPermission();

    document.getElementById('createReminder').addEventListener('click', ()=>{
        const type = document.getElementById('type').value;
        const msg = document.getElementById('message').value;
        const from = document.getElementById('fromTime').value;
        const to = document.getElementById('toTime').value;
        const every = document.getElementById('everyMin').value;
        if(!type){ alert('Select Type'); return; }
        if((!from||!to)&&!every){ alert('Fill either From/To or Every X min'); return; }
        const condition = every ? `Every ${every} min` : `From ${from} to ${to}`;
        reminders.push({type:type,message:msg,condition:condition});
        renderReminders();
        if(type==='Grayscale'){ document.body.style.filter='grayscale(80%)'; }
        if(type==='Alert'){
            if(Notification.permission==='granted'){ new Notification(msg||'Focus Reminder!'); }
            else{ alert(msg||'Focus Reminder!'); }
        }
    });
</script>
</body>
</html>
